<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="Boshqaruv Paneli">Boshqaruv Paneli</title>
    <link rel="stylesheet" href="css/admin_style.css">
    <link rel="stylesheet" href="css/product_cards.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/guard.js"></script>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="brand-title" data-translate="Tizim 2026">Tizim 2026</h2>
        </div>
        <nav class="sidebar-menu">
            <a href="admin_panel.html" class="menu-item active">
                <i class="ph ph-squares-four"></i> <span data-translate="Bosh sahifa">Bosh sahifa</span>
            </a>
            <a href="warehouse_control.html" class="menu-item">
                <i class="ph ph-package"></i> <span data-translate="Ombor nazorati">Ombor nazorati</span>
            </a>
            <a href="product.html" class="menu-item"><i class="ph ph-tag"></i> <span data-translate="Yangi maxsulot">Yangi maxsulot</span></a>
            <a href="production.html" class="menu-item">
                <i class="ph ph-factory"></i> <span data-translate="Ishlab chiqarish">Ishlab chiqarish</span>
            </a>
            <a href="sales_and_revenue.html" class="menu-item">
                <i class="ph ph-shopping-cart"></i> <span data-translate="Sotuv va Tushumlar">Sotuv va Tushumlar</span>
            </a>
            <a href="reports.html" class="menu-item">
                <i class="ph ph-chart-line-up"></i> <span data-translate="Hisobotlar">Hisobotlar</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="menu-item logout-btn">
                <i class="ph ph-sign-out"></i> <span data-translate="Chiqish">Chiqish</span>
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title" data-translate="Admin Panel">Admin Panel</h1>
            <div class="topbar-actions">
                <button id="fontDecrease" class="badge-btn" title="Shriftni kichiklashtirish">A-</button>
                <button id="fontIncrease" class="badge-btn" title="Shriftni kattalashtirish">A+</button>

                <button id="langToggle" class="badge-btn" title="Lotin / Кирилл">
                    <i class="ph ph-translate" id="langIcon"></i>
                </button>

                <button id="themeToggle" class="badge-btn">
                    <i class="ph ph-moon" id="themeIcon"></i>
                    <span id="themeText" data-translate="Dark Mode">Dark Mode</span>
                </button>

                <div class="user-badge">
                    <span class="status-dot"></span>
                    <span id="adminName" data-translate="Yuklanmoqda...">Yuklanmoqda...</span>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div id="productGrid" class="product-grid">
                <div class="loader" data-translate="Ma'lumotlar yuklanmoqda...">Ma'lumotlar yuklanmoqda...</div>
            </div>
        </div>
    </main>
</div>

<script src="js/admin_script.js"></script>
<script src="js/products_fetch.js"></script>
</body>
</html>
