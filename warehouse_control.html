<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="Ombor Nazorati | Tizim 2026">Ombor Nazorati | Tizim 2026</title>
    <link rel="stylesheet" href="css/admin_style.css">
    <link rel="stylesheet" href="css/warehouse_style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/guard.js"></script>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="brand-title" data-translate="Tizim 2026">Tizim 2026</h2>
        </div>
        <nav class="sidebar-menu">
            <a href="admin_panel.html" class="menu-item"><i class="ph ph-squares-four"></i> <span data-translate="Bosh sahifa">Bosh sahifa</span></a>
            <a href="warehouse_control.html" class="menu-item active"><i class="ph ph-package"></i> <span data-translate="Ombor nazorati">Ombor nazorati</span></a>
            <a href="product.html" class="menu-item"><i class="ph ph-tag"></i> <span data-translate="Yangi maxsulot">Yangi maxsulot</span></a>
            <a href="production.html" class="menu-item"><i class="ph ph-factory"></i> <span data-translate="Ishlab chiqarish">Ishlab chiqarish</span></a>
            <a href="sales_and_revenue.html" class="menu-item"><i class="ph ph-shopping-cart"></i> <span data-translate="Sotuv va Tushumlar">Sotuv va Tushumlar</span></a>
            <a href="reports.html" class="menu-item"><i class="ph ph-chart-line-up"></i> <span data-translate="Hisobotlar">Hisobotlar</span></a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="menu-item logout-btn"><i class="ph ph-sign-out"></i> <span data-translate="Chiqish">Chiqish</span></button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title" data-translate="Ombor nazorati">Ombor nazorati</h1>
            <div class="topbar-actions">
                <button id="fontDecrease" class="badge-btn" title="Shriftni kichiklashtirish">A-</button>
                <button id="fontIncrease" class="badge-btn" title="Shriftni kattalashtirish">A+</button>

                <button id="langToggle" class="badge-btn" title="Lotin / Кирилл">
                    <i class="ph ph-translate" id="langIcon"></i>
                </button>

                <button id="themeToggle" class="badge-btn">
                    <i class="ph ph-moon" id="themeIcon"></i>
                    <span id="themeText" data-translate="Dark Mode">Dark Mode</span>
                </button>
                <div class="user-badge">
                    <span class="status-dot"></span>
                    <span id="adminName" data-translate="Yuklanmoqda...">Yuklanmoqda...</span>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="warehouse-grid">
                <section class="form-section card">
                    <h3 class="section-title"><span data-translate="| Xomashyo kiritish">| Xomashyo kiritish</span></h3>
                    <form id="materialForm">
                        <div class="form-group">
                            <label data-translate="Xomashyo nomi">Xomashyo nomi</label>
                            <select id="mat_name" required>
                                <option value="" disabled selected data-translate="Tanlang...">Tanlang...</option>
                                <!-- Qolgan optionlar endi bazadan JS orqali keladi -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label data-translate="O'lchov birligi">O'lchov birligi</label>
                            <select id="mat_unit" required>
                                <option value="kg" data-translate="Kilogramm (kg)">Kilogramm (kg)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label data-translate="Kelib tushgan miqdor (Massa)">Kelib tushgan miqdor (Massa)</label>
                            <input type="number" step="0.01" id="mat_stock" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label data-translate="O'rtacha narxi 1kg uchun (so'mda)">O'rtacha narxi 1kg uchun (so'mda)</label>
                            <input type="number" id="mat_cost" placeholder="Summani kiriting..." data-translate-placeholder="Summani kiriting..." required>
                        </div>
                        <button type="submit" class="submit-btn" id="saveBtn" data-translate="Saqlash hamda ro'yxatga qo'shish">Saqlash hamda ro'yxatga qo'shish</button>
                    </form>
                </section>

                <section class="list-section card">
                    <h3 class="section-title"><span data-translate="| Kiritilgan xomashyolar tarixi">| Kiritilgan xomashyolar tarixi</span></h3>
                    <div class="table-container">
                        <table>
                            <thead>
                            <tr>
                                <th data-translate="ID">ID</th>
                                <th data-translate="Nomi">Nomi</th>
                                <th data-translate="Kiritilgan massa">Kiritilgan massa</th>
                                <th data-translate="1kg narxi">1kg narxi</th>
                                <th data-translate="Umumiy qiymat">Umumiy qiymat</th>
                                <th data-translate="Kiritilgan vaqt">Kiritilgan vaqt</th>
                            </tr>
                            </thead>
                            <tbody id="materialsTableBody">
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>

<script src="js/admin_script.js"></script>
<script src="js/warehouse_control.js"></script>
</body>
</html>
