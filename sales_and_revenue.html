<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="Sotuv va Tushumlar | Tizim 2026">Sotuv va Tushumlar | Tizim 2026</title>
    <link rel="stylesheet" href="css/admin_style.css">
    <link rel="stylesheet" href="css/sales_and_revenue.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="js/guard.js"></script>
</head>
<body>

<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="brand-title" data-translate="Tizim 2026">Tizim 2026</h2>
        </div>
        <nav class="sidebar-menu">
            <a href="admin_panel.html" class="menu-item"><i class="ph ph-squares-four"></i> <span data-translate="Bosh sahifa">Bosh sahifa</span></a>
            <a href="warehouse_control.html" class="menu-item"><i class="ph ph-package"></i> <span data-translate="Ombor nazorati">Ombor nazorati</span></a>
            <a href="production.html" class="menu-item"><i class="ph ph-factory"></i> <span data-translate="Ishlab chiqarish">Ishlab chiqarish</span></a>
            <a href="sales_and_revenue.html" class="menu-item active"><i class="ph ph-shopping-cart"></i> <span data-translate="Sotuv va Tushumlar">Sotuv va Tushumlar</span></a>
            <a href="reports.html" class="menu-item"><i class="ph ph-chart-line-up"></i> <span data-translate="Hisobotlar">Hisobotlar</span></a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="menu-item logout-btn"><i class="ph ph-sign-out"></i> <span data-translate="Chiqish">Chiqish</span></button>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title" data-translate="Sotuv va tushumlar bo'limi">Sotuv va tushumlar bo'limi</h1>
            <div class="topbar-actions">
                <button id="fontDecrease" class="badge-btn" title="Shriftni kichiklashtirish">A-</button>
                <button id="fontIncrease" class="badge-btn" title="Shriftni kattalashtirish">A+</button>

                <button id="langToggle" class="badge-btn" title="Lotin / Кирилл">
                    <i class="ph ph-translate" id="langIcon"></i>
                </button>

                <button id="themeToggle" class="badge-btn">
                    <i class="ph ph-moon" id="themeIcon"></i>
                    <span id="themeText" data-translate="Dark Mode">Dark Mode</span>
                </button>
                <div class="user-badge">
                    <span class="status-dot"></span>
                    <span id="adminName" data-translate="Yuklanmoqda...">Yuklanmoqda...</span>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            <div class="sales-container">

                <div class="selection-side">
                    <div class="section-card">
                        <div class="product-display">
                            <div class="img-placeholder">
                                <img id="cardImage" src="" alt="Paving Stone">
                            </div>
                            <div class="product-info">
                                <h2 id="cardTitle" data-translate="Bruchatka nomi">Bruchatka nomi</h2>
                                <div class="price-stock-row">
                                    <div class="info-box">
                                        <span data-translate="Narxi (1 m²)">Narxi (1 m²)</span>
                                        <strong id="cardPrice">0</strong>
                                    </div>
                                    <div class="info-box">
                                        <span data-translate="Omborda">Omborda</span>
                                        <strong id="cardStock">0 m²</strong>
                                    </div>
                                </div>
                                <div class="input-field">
                                    <label data-translate="Sotib olinadigan miqdor (m²)">Sotib olinadigan miqdor (m²)</label>
                                    <input type="number" id="orderQuantity" placeholder="0.00" step="0.01">
                                </div>
                                <div class="action-buttons">
                                    <button id="addToListBtn" class="btn-outline">
                                        <i class="ph ph-plus-circle"></i> <span data-translate="Ro'yxatga qo'shish">Ro'yxatga qo'shish</span>
                                    </button>
                                    <button id="placeOrderBtn" class="btn-fill">
                                        <i class="ph ph-shopping-cart-simple"></i> <span data-translate="Buyurtma berish">Buyurtma berish</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="carousel-controls">
                        <button id="prevBtn" class="circle-btn"><i class="ph ph-caret-left"></i></button>
                        <button id="nextBtn" class="circle-btn"><i class="ph ph-caret-right"></i></button>
                    </div>
                </div>

                <div class="basket-side">
                    <div class="section-card">
                        <div class="card-header">
                            <h3><i class="ph ph-list-numbers"></i> <span data-translate="Tanlangan mahsulotlar">Tanlangan mahsulotlar</span></h3>
                            <button id="printBtn" class="print-btn"><i class="ph ph-printer"></i> <span data-translate="Chop etish">Chop etish</span></button>
                        </div>
                        <div class="table-area">
                            <table class="modern-table">
                                <thead>
                                <tr>
                                    <th data-translate="Mahsulot">Mahsulot</th>
                                    <th data-translate="Miqdor">Miqdor</th>
                                    <th data-translate="Summa">Summa</th>
                                    <th style="width: 50px;"></th>
                                </tr>
                                </thead>
                                <tbody id="orderListBody">
                                </tbody>
                            </table>
                        </div>
                        <div class="total-bar">
                            <span data-translate="Umumiy summa:">Umumiy summa:</span>
                            <h2 id="grandTotal">0 so'm</h2>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<!-- MIJOZ MA'LUMOTLARINI SO'RASH UCHUN MODAL OYNA -->
<div id="customerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3 data-translate="Mijoz ma'lumotlari">Mijoz ma'lumotlari</h3>
        <div class="input-field" style="margin-bottom: 15px;">
            <label data-translate="Mijoz telefon raqami">Mijoz telefon raqami <span style="color:red">*</span></label>
            <input type="text" id="customerPhone" placeholder="+998 90 123 45 67" required>
        </div>
        <div class="input-field" style="margin-bottom: 20px;">
            <label data-translate="Mijoz manzili">Mijoz manzili <span style="color:red">*</span></label>
            <input type="text" id="customerAddress" placeholder="Manzilni kiriting..." required>
        </div>
        <div class="action-buttons modal-actions">
            <button id="cancelModalBtn" class="btn-outline"><span data-translate="Bekor qilish">Bekor qilish</span></button>
            <button id="confirmModalBtn" class="btn-fill"><i class="ph ph-check-circle"></i> <span data-translate="Tasdiqlash va Chop etish">Tasdiqlash va Chop etish</span></button>
        </div>
    </div>
</div>

<div id="receiptArea" class="receipt-print-zone"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin_script.js"></script>
<script src="js/salse_and_revenue.js"></script>
</body>
</html>
